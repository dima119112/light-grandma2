name: Update schedule

on:
  schedule:
    # GitHub runs this in UTC and may start it a few minutes late.
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-schedule
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install parser dependencies
        run: pip install -r requirements.txt

      - name: Fetch the official schedule
        run: python scripts/update_schedule.py

      - name: Commit schedule.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add schedule.json
          if git diff --cached --quiet; then
            echo "Schedule unchanged."
          else
            git commit -m "Update schedule"
            git push
          fi