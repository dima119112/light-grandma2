<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3eee6">
  <title>Коли буде світло?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,560;7..72,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <main class="app">
    <header class="top">
      <p class="eyebrow">Житомир · група 4.1</p>
      <h1>Коли буде світло?</h1>
    </header>

    <section id="statusCard" class="status-card unknown" aria-live="polite">
      <div class="status-main">
        <div id="statusIcon" class="status-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 18h6"/>
            <path d="M10 21h4"/>
            <path d="M12 3a6 6 0 0 0-3.2 11.1c.5.4.8 1 .9 1.6h4.6c.1-.6.4-1.2.9-1.6A6 6 0 0 0 12 3z"/>
          </svg>
        </div>
        <div>
          <p class="status-kicker">Зараз</p>
          <p id="statusTitle" class="status-title">Перевіряємо графік…</p>
        </div>
      </div>
      <p id="statusUntil" class="status-until" hidden></p>
      <p id="statusDescription" class="status-description">Зачекайте, будь ласка.</p>
    </section>

    <section class="schedule-section">
      <div class="section-heading">
        <h2>Сьогодні</h2>
        <span id="scheduleDate" class="date">—</span>
      </div>
      <div class="day" aria-hidden="true">
        <div id="dayBar" class="day-bar"></div>
        <div class="day-hours">
          <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
      </div>
      <div id="periods" class="periods">
        <div class="loading">Завантажуємо розклад…</div>
      </div>
    </section>

    <footer>
      <p id="updated">Час оновлення: перевіряємо…</p>
      <p class="note">Графік попередній: аварійні відключення можливі поза ним.</p>
      <button id="refreshButton" class="refresh-button" type="button">Оновити графік</button>
      <a class="source-link" href="https://www.ztoe.com.ua/unhooking-search.php" target="_blank" rel="noopener">Офіційний сайт Житомиробленерго</a>
    </footer>
  </main>
  <script src="app.js?v=4"></script>
</body>
</html>
